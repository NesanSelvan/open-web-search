# EXAMPLE overlay — an Indian food corpus. Not loaded unless you point at it:
#
#   WS_DOMAINS_FILE=config/domains.india.example.yaml
#
# This file is what a deployment's OPINIONS look like, kept out of the engine so
# the engine stays general. Copy it, delete what you do not care about, add your
# own. None of it is required to run.

defaults:
  rate_per_min: 6
  needs_browser: false
  needs_residential: false
  cache_ttl_s: 86400
  respect_robots: true

domains:
  google.com:
    rate_per_min: 2
    needs_browser: true
    cache_ttl_s: 0
    respect_robots: false

  # --- quick commerce -------------------------------------------------------
  # These serve a DIFFERENT catalogue per location, so geo is a correctness
  # setting, not a performance one. Swiggy strips the nutrition table entirely for
  # a SKU that is sold out at the resolved store, so a wrong store looks exactly
  # like a missing panel — and a long cache TTL freezes that mistake in place.
  swiggy.com:
    rate_per_min: 20
    needs_browser: true
    needs_residential: true
    geo: { lat: 12.9716, lng: 77.5946 }
    cache_ttl_s: 3600
    respect_robots: false
    trust: retailer

  zeptonow.com:
    rate_per_min: 20
    needs_browser: false        # SSR product page: the panel is in the first HTML
    needs_residential: true
    geo: { lat: 12.9716, lng: 77.5946 }
    cache_ttl_s: 3600
    respect_robots: false
    trust: retailer

  blinkit.com:
    rate_per_min: 10
    needs_browser: true
    needs_residential: true
    geo: { lat: 12.9716, lng: 77.5946 }
    cache_ttl_s: 3600
    respect_robots: false
    trust: retailer

  # --- retailers ------------------------------------------------------------
  bigbasket.com:
    rate_per_min: 15
    needs_residential: true
    cache_ttl_s: 86400
    respect_robots: false
    trust: retailer

  # --- brand stores: the maker transcribing its own pack label ---------------
  nutrabay.com:
    rate_per_min: 30
    cache_ttl_s: 604800
    respect_robots: false
    trust: brand

  yogabar.in:            { trust: brand, rate_per_min: 30 }
  thewholetruthfoods.com: { trust: brand, rate_per_min: 30 }
  muscleblaze.com:       { trust: brand, rate_per_min: 20 }
  epigamiastore.com:     { trust: brand, rate_per_min: 30 }
  maxprotein.in:         { trust: brand, rate_per_min: 30 }

  healthkart.com:
    rate_per_min: 8              # 429s quickly; this one genuinely needs to be slow
    needs_browser: true
    cache_ttl_s: 604800
    respect_robots: false
    trust: retailer

  # --- aggregators ----------------------------------------------------------
  fatsecret.co.in:
    rate_per_min: 30
    cache_ttl_s: 604800
    respect_robots: false
    trust: aggregator

  # --- composition tables ---------------------------------------------------
  # Indian Food Composition Table data. Laboratory-derived, so it outranks every
  # retailer transcription — but note it still needs the plausibility guard: this
  # source has been observed duplicating its PUFA figure into the cholesterol row.
  anuvaad.org.in:
    rate_per_min: 20
    cache_ttl_s: 2592000
    trust: lab

# Panel exists only inside a product photo. Fetched for name/brand/pack size, but
# the reader refuses to guess a number from a title or meta description.
image_only_panels:
  - blinkit.com
  - amazon.in
  - beastlife.in
